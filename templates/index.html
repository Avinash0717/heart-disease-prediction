<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Heart Disease Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>❤️ Heart Disease Prediction</h1>

        <p class="subtitle">
            Enter the patient's clinical details to predict the risk of heart disease.
        </p>

        <form action="/predict" method="POST">

            <div class="grid">

                <div>

                    <label>Age</label>

                    <input
                        type="number"
                        name="age"
                        required>

                </div>

                <div>

                    <label>Sex</label>

                    <select name="sex">

                        <option value="1">Male</option>

                        <option value="0">Female</option>

                    </select>

                </div>

                <div>

                    <label>Chest Pain Type</label>

                    <select name="cp">

                        <option value="0">Typical Angina</option>

                        <option value="1">Atypical Angina</option>

                        <option value="2">Non-anginal Pain</option>

                        <option value="3">Asymptomatic</option>

                    </select>

                </div>

                <div>

                    <label>Resting Blood Pressure</label>

                    <input
                        type="number"
                        name="trestbps"
                        required>

                </div>

                <div>

                    <label>Cholesterol</label>

                    <input
                        type="number"
                        name="chol"
                        required>

                </div>

                <div>

                    <label>Fasting Blood Sugar</label>

                    <select name="fbs">

                        <option value="0">≤ 120 mg/dl</option>

                        <option value="1">> 120 mg/dl</option>

                    </select>

                </div>

                <div>

                    <label>Rest ECG</label>

                    <select name="restecg">

                        <option value="0">Normal</option>

                        <option value="1">ST-T Wave Abnormality</option>

                        <option value="2">Left Ventricular Hypertrophy</option>

                    </select>

                </div>

                <div>

                    <label>Maximum Heart Rate</label>

                    <input
                        type="number"
                        name="thalach"
                        required>

                </div>

                <div>

                    <label>Exercise Induced Angina</label>

                    <select name="exang">

                        <option value="0">No</option>

                        <option value="1">Yes</option>

                    </select>

                </div>

                <div>

                    <label>Old Peak</label>

                    <input
                        type="number"
                        step="0.1"
                        name="oldpeak"
                        required>

                </div>

                <div>

                    <label>Slope</label>

                    <select name="slope">

                        <option value="0">Upsloping</option>

                        <option value="1">Flat</option>

                        <option value="2">Downsloping</option>

                    </select>

                </div>

                <div>

                    <label>Major Vessels (CA)</label>

                    <select name="ca">

                        <option value="0">0</option>

                        <option value="1">1</option>

                        <option value="2">2</option>

                        <option value="3">3</option>

                        <option value="4">4</option>

                    </select>

                </div>

                <div class="full-width">

                    <label>Thalassemia</label>

                    <select name="thal">

                        <option value="0">Unknown</option>

                        <option value="1">Normal</option>

                        <option value="2">Fixed Defect</option>

                        <option value="3">Reversible Defect</option>

                    </select>

                </div>

            </div>

            <button type="submit">
                Predict
            </button>

        </form>

        {% if prediction %}

        <div class="result">

            <h2>{{ prediction }}</h2>

        </div>

        {% endif %}

    </div>

</div>

</body>

</html>
